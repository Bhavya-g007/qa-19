---
- name: Install Apache Tomcat
  hosts: all
  become: true

  tasks:
    - name: Install Java and wget
      yum:
        name: ['wget', 'java-21-openjdk']
        state: present

    - name: Download Tomcat archive
      get_url:
        url: https://dlcdn.apache.org/tomcat/tomcat-11/v11.0.13/bin/apache-tomcat-11.0.13.tar.gz
        dest: /tmp/apache-tomcat.tar.gz

    - name: Extract Tomcat
      unarchive:
        src: /tmp/apache-tomcat.tar.gz
        dest: /opt/
        remote_src: yes

    - name: Rename Tomcat directory
      command: mv /opt/apache-tomcat-11.0.13 /opt/tomcat
      args:
        creates: /opt/tomcat

    - name: Add admin user to tomcat-users.xml
      copy:
        dest: /opt/tomcat/conf/tomcat-users.xml
        content: |
          <tomcat-users>
            <role rolename="manager-gui"/>
            <role rolename="admin-gui"/>
            <user username="admin" password="admin123" roles="manager-gui,admin-gui"/>
          </tomcat-users>
      notify: Restart Tomcat

    - name: Allow remote access - overwrite manager context.xml
      copy:
        content: |
          <Context antiResourceLocking="false" privileged="true">
            <!-- Removed RemoteAddrValve to allow access from any IP -->
          </Context>
        dest: /opt/tomcat/webapps/manager/META-INF/context.xml
      notify: Restart Tomcat

    - name: Allow remote access - overwrite host-manager context.xml
      copy:
        content: |
          <Context antiResourceLocking="false" privileged="true">
            <!-- Removed RemoteAddrValve to allow access from any IP -->
          </Context>
        dest: /opt/tomcat/webapps/host-manager/META-INF/context.xml
      notify: Restart Tomcat

    - name: Deploy application JAR to Tomcat (optional)
      copy:
        src: /tmp/app.jar
        dest: /opt/tomcat/webapps/app.jar
        remote_src: yes
      ignore_errors: yes
      notify: Restart Tomcat

  handlers:
    - name: Restart Tomcat
      shell: |
        /opt/tomcat/bin/shutdown.sh || true
        sleep 5
        nohup /opt/tomcat/bin/startup.sh &
      args:
        executable: /bin/bash
