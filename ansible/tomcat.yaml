---
- name: Install Apache Tomcat
  hosts: all
  become: true

  tasks:
    - name: Install Java and wget
      yum:
        name: ['wget', 'java-21-openjdk']
        state: present

    - name: Download Tomcat archive
      get_url:
        url: https://dlcdn.apache.org/tomcat/tomcat-11/v11.0.13/bin/apache-tomcat-11.0.13.tar.gz
        dest: /tmp/apache-tomcat.tar.gz

    - name: Extract Tomcat
      unarchive:
        src: /tmp/apache-tomcat.tar.gz
        dest: /opt/
        remote_src: yes

    - name: Rename Tomcat directory
      command: mv /opt/apache-tomcat-11.0.13 /opt/tomcat
      args:
        creates: /opt/tomcat

    - name: Add admin user to tomcat-users.xml
      blockinfile:
        path: /opt/tomcat/conf/tomcat-users.xml
        marker: ""
        insertafter: "<tomcat-users>"
        block: |
          <role rolename="manager-gui"/>
          <role rolename="admin-gui"/>
          <user username="admin" password="admin123" roles="manager-gui,admin-gui"/>

    - name: Remove IP restrictions from manager app
      replace:
        path: /opt/tomcat/webapps/manager/META-INF/context.xml
        regexp: '.*RemoteAddrValve.*'
        replace: ''
      notify: Restart Tomcat

    - name: Remove IP restrictions from host-manager app
      replace:
        path: /opt/tomcat/webapps/host-manager/META-INF/context.xml
        regexp: '.*RemoteAddrValve.*'
        replace: ''
      notify: Restart Tomcat

    - name: Deploy application JAR to Tomcat (optional)
      copy:
        src: /tmp/app.jar
        dest: /opt/tomcat/webapps/app.jar
        remote_src: yes
      notify: Restart Tomcat

  handlers:
    - name: Restart Tomcat
      shell: |
        /opt/tomcat/bin/shutdown.sh || true
        sleep 5
        nohup /opt/tomcat/bin/startup.sh &
      args:
        executable: /bin/bash
